name: Update seats left

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [seat-check]

permissions:
  contents: write

concurrency:
  group: seats
  cancel-in-progress: false

jobs:
  seats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Give GoHighLevel a moment after a payment
        if: github.event_name == 'repository_dispatch'
        run: sleep 20
      - name: Read seats from GoHighLevel
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: node tools/update-seats.mjs
      - name: Save if changed
        run: |
          if git diff --quiet seats.json; then echo "Nothing to save"; exit 0; fi
          git config user.name "seat-counter"
          git config user.email "seat-counter@users.noreply.github.com"
          git add seats.json
          git commit -m "Update seats left"
          git push
